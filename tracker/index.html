function fm(v){if(v==null)return null;return v>=1000?"$"+(v/1000).toFixed(1).replace(/\.0$/,"")+"B":"$"+Math.round(v)+"M"}
function pd(s){if(!s)return 0;const m={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};const l=s.toLowerCase();let y=2025,mo=6;const ym=l.match(/(\d{4})/);if(ym)y=+ym[1];for(const[k,v] of Object.entries(m))if(l.includes(k)){mo=v;break}return y*100+mo}
function nn(s){return s.split(/[\/+]/).map(x=>x.trim()).filter(Boolean)}

function Eco({d}){
  if(!d.dd)return(<span style={{fontSize:12,color:"#5A6169",fontStyle:"italic"}}>{d.dl||"Undisclosed"}</span>);
  const u=fm(d.u),t=fm(d.tp);
  if(u)return(<div style={{textAlign:"right",minWidth:80}}><div style={{fontSize:14,fontWeight:800,color:"#14181D"}}>{u}</div><div style={{fontSize:10,color:"#5A6169"}}>committed</div>{t&&t!==u&&<div style={{fontSize:11,color:"#5A6169"}}>{t} potential</div>}</div>);
  if(t)return(<div style={{textAlign:"right"}}><div style={{fontSize:13,fontWeight:700,color:"#14181D"}}>{t}</div><div style={{fontSize:10,color:"#5A6169"}}>potential</div></div>);
  return(<span style={{fontSize:12,color:"#5A6169"}}>{d.dl}</span>);
}

function Badge({lv}){const e=EV[lv]||EV.research;return(<span style={{fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:4,background:e.c+"15",color:e.c}}>{e.i} {e.l}</span>)}

function Row({d,open,tog,gP,gS}){
  const tc=TC[d.t]||"#6b7280";
  return(

            <span style={{fontSize:10,fontWeight:700,color:tc,background:tc+"12",padding:"2px 7px",borderRadius:4,textTransform:"uppercase"}}>{d.t}</span>
            {d.ev&&<Badge lv={d.ev}/>}
            <span style={{fontSize:11,color:"#5A6169"}}>{d.dt}</span>
          </div>
          <div style={{fontSize:15,fontWeight:600,color:"#14181D",marginBottom:2}}>
            <span onClick={e=>{e.stopPropagation();gP(d.p)}} style={{cursor:"pointer",borderBottom:"1px dashed #0E7C86"}}>{d.p}</span>
            {" × "}
            <span onClick={e=>{e.stopPropagation();gS(d.s)}} style={{cursor:"pointer",borderBottom:"1px dashed #0E7C86"}}>{d.s}</span>
          </div>
          <div style={{fontSize:13,color:"#5A6169",lineHeight:1.4}}>{d.sm}</div>
          <div style={{display:"flex",gap:4,flexWrap:"wrap",marginTop:5}}>
            {d.st.map(s=>{const c=C.find(x=>x.id===s);return c?<span key={s} style={{fontSize:9,padding:"2px 5px",background:c.c+"15",color:c.c,borderRadius:3,fontWeight:600}}>{c.l}</span>:null})}
          </div>
        </div>
        <Eco d={d}/>
        <span style={{fontSize:16,color:"#5A6169",transform:open?"rotate(180deg)":"none",transition:"transform 0.2s"}}>▾</span>
      </div>
      {open&&(
        <div style={{padding:"0 18px 16px",borderTop:"1px solid #E6E1D6"}}>
          {d.ar&&<div style={{marginTop:10}}><span style={{fontSize:10,fontWeight:700,padding:"3px 7px",borderRadius:4,background:"#F7F5EF",color:"#5A6169",textTransform:"uppercase"}}>{d.ar}</span></div>}
          {d.dd&&(d.u!=null||d.tp!=null)&&(
            <div style={{marginTop:10,padding:"8px 12px",background:"#F7F5EF",borderRadius:8,border:"1px solid #E6E1D6",display:"flex",gap:20}}>
              {d.u!=null&&<div><div style={{fontSize:9,fontWeight:600,color:"#5A6169",textTransform:"uppercase"}}>Upfront</div><div style={{fontSize:15,fontWeight:800,color:"#14181D"}}>{fm(d.u)}</div></div>}
              {d.tp!=null&&<div><div style={{fontSize:9,fontWeight:600,color:"#5A6169",textTransform:"uppercase"}}>Total potential</div><div style={{fontSize:15,fontWeight:800,color:"#5A6169"}}>{fm(d.tp)}</div></div>}

            {d.de&&<div><div style={{fontSize:10,fontWeight:700,color:"#0E7C86",textTransform:"uppercase",marginBottom:4}}>Strategic Shift</div><p style={{fontSize:12,color:"#14181D",lineHeight:1.5,margin:0}}>{d.de}</p></div>}
          </div>
        </div>
      )}
    </div>
  );
}

function App(){
  const[ac,setAc]=useState(null);
  const[ex,setEx]=useState(null);
  const[sr,setSr]=useState("");
  const[so,setSo]=useState("newest");
  const[vw,setVw]=useState("list");

  const bs=useMemo(()=>{const m={};C.forEach(c=>m[c.id]=[]);D.forEach(d=>d.st.forEach(s=>{if(m[s])m[s].push(d)}));return m},[]);
  const fd=useMemo(()=>{
    let r=[...D];
    if(ac)r=r.filter(d=>d.st.includes(ac));
    if(sr.trim()){const q=sr.toLowerCase();r=r.filter(d=>d.p.toLowerCase().includes(q)||d.s.toLowerCase().includes(q)||d.sm.toLowerCase().includes(q)||(d.ar||"").toLowerCase().includes(q))}
    if(so==="newest")r.sort((a,b)=>pd(b.dt)-pd(a.dt));
    else if(so==="oldest")r.sort((a,b)=>pd(a.dt)-pd(b.dt));
    else r.sort((a,b)=>(b.u??b.tp??0)-(a.u??a.tp??0));
    return r;
  },[ac,sr,so]);

  const uP=useMemo(()=>new Set(D.flatMap(d=>nn(d.p))).size,[]);
  const uS=useMemo(()=>new Set(D.map(d=>d.s)).size,[]);
  const tt=useMemo(()=>{let c=0,p=0;D.forEach(d=>{c+=d.u||0;p+=d.tp||0});return{c:fm(c)+"+",p:fm(p)+"+"}},[]);

  const gP=useCallback(n=>setVw({t:"p",n}),[]);
  const gS=useCallback(n=>setVw({t:"s",n}),[]);

  if(vw!=="list"){
    const isP=vw.t==="p";
    const deals=D.filter(d=>isP?(d.p===vw.n||nn(d.p).some(x=>x===vw.n||vw.n.includes(x)||x.includes(vw.n))):d.s===vw.n);
    const sorted=[...deals].sort((a,b)=>pd(b.dt)-pd(a.dt));
    let tu=0,tp=0;deals.forEach(d=>{tu+=d.u||0;tp+=d.tp||0});
    return(
      <div style={{fontFamily:"'Inter',system-ui,sans-serif",background:"#F7F5EF",minHeight:"100vh",padding:24,maxWidth:960,margin:"0 auto"}}>
        <button onClick={()=>setVw("list")} style={{padding:"8px 14px",fontSize:13,fontWeight:600,borderRadius:8,border:"1.5px solid #E6E1D6",background:"#fff",color:"#5A6169",cursor:"pointer",marginBottom:20}}>← Back</button>
        <div style={{fontSize:11,fontWeight:600,color:isP?"#0E7C86":"#7c3aed",textTransform:"uppercase",marginBottom:4}}>{isP?"Pharma Company":"AI Partner"}</div>
        <h2 style={{margin:"0 0 16px",fontSize:24,fontWeight:800,color:"#14181D"}}>{vw.n}</h2>
        <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:20}}>
          {[{l:"Deals",v:deals.length},{l:"Committed",v:tu>0?fm(tu):"—"},{l:"Potential",v:tp>0?fm(tp):"—"}].map(s=>(
            <div key={s.l} style={{padding:"10px 14px",background:"#fff",borderRadius:8,border:"1px solid #E6E1D6",flex:"1 1 100px"}}>
              <div style={{fontSize:18,fontWeight:800,color:"#14181D"}}>{s.v}</div><div style={{fontSize:11,color:"#5A6169"}}>{s.l}</div>
            </div>
          ))}
        </div>
        {sorted.map(d=>(
          <div key={d.id} style={{padding:"12px 14px",border:"1px solid #E6E1D6",borderRadius:8,background:"#fff",marginBottom:8}}>
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
              <span style={{fontSize:10,fontWeight:700,color:TC[d.t]||"#6b7280",background:(TC[d.t]||"#6b7280")+"12",padding:"2px 6px",borderRadius:3,textTransform:"uppercase"}}>{d.t}</span>
              <span style={{fontSize:11,color:"#5A6169"}}>{d.dt}</span>
            </div>
            <div style={{fontSize:14,fontWeight:600,color:"#14181D",marginBottom:3}}>
              <span onClick={()=>gP(d.p)} style={{cursor:"pointer",borderBottom:"1px dashed #0E7C86"}}>{d.p}</span>{" × "}<span onClick={()=>gS(d.s)} style={{cursor:"pointer",borderBottom:"1px dashed #0E7C86"}}>{d.s}</span>
            </div>
            <div style={{fontSize:12,color:"#5A6169",marginBottom:4}}>{d.sm}</div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{display:"flex",gap:3}}>{d.st.map(s=>{const c=C.find(x=>x.id===s);return c?<span key={s} style={{fontSize:9,padding:"2px 5px",background:c.c+"15",color:c.c,borderRadius:3,fontWeight:600}}>{c.l}</span>:null})}</div>
              <Eco d={d}/>
            </div>
          </div>
        ))}
      </div>
    );
  }

  return(
    <div style={{fontFamily:"'Inter',system-ui,sans-serif",background:"#F7F5EF",minHeight:"100vh",color:"#14181D"}}>
      <div style={{background:"linear-gradient(135deg,#14181D,#1e2730)",padding:"32px 24px 24px",color:"#fff"}}>
        <div style={{maxWidth:960,margin:"0 auto"}}>
          <div style={{fontSize:11,fontWeight:600,color:"#0E7C86",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:6}}>AI × Pharma Intelligence</div>
          <h1 style={{margin:"0 0 6px",fontSize:24,fontWeight:800,letterSpacing:"-0.03em"}}>Deal & Partnership Tracker</h1>
          <p style={{margin:"0 0 18px",fontSize:13,color:"#94a3b8",maxWidth:560}}>Tracking how big pharma embeds AI — from molecule creation through enterprise operations.</p>
          <div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
            {[{n:D.length,l:"Deals"},{n:uP+"+",l:"Pharma cos"},{n:uS,l:"AI partners"},{n:tt.c,l:"Committed"},{n:tt.p,l:"Potential"}].map(s=>(
              <div key={s.l}><div style={{fontSize:20,fontWeight:800,color:"#0E7C86"}}>{s.n}</div><div style={{fontSize:10,color:"#94a3b8"}}>{s.l}</div></div>
            ))}
          </div>
        </div>
      </div>
      <div style={{maxWidth:960,margin:"0 auto",padding:"20px 24px 50px"}}>
        <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:12}}>
          {C.map(c=>{const n=(bs[c.id]||[]).length;const a=ac===c.id;return(
            <button key={c.id} onClick={()=>setAc(a?null:c.id)} style={{flex:"1 1 0",minWidth:90,padding:"10px 6px",borderRadius:8,cursor:"pointer",border:"2px solid "+(a?c.c:"#E6E1D6"),background:a?c.c+"12":"#fff"}}>
              <div style={{fontSize:16,fontWeight:800,color:a?c.c:"#14181D"}}>{n}</div>
              <div style={{fontSize:10,fontWeight:600,color:a?c.c:"#5A6169"}}>{c.l}</div>
            </button>
          )})}
        </div>
        <div style={{padding:"10px 14px",background:"#F7F5EF",borderRadius:8,border:"1px solid #E6E1D6",fontSize:11,color:"#5A6169",lineHeight:1.5,marginBottom:16}}>
          <strong style={{color:"#0E7C86"}}>Reading the economics:</strong> "Committed" = upfront cash paid. "Potential" = milestone payments contingent on success. Fewer than 10% of life sciences milestones are triggered. No AI-designed drug has yet received regulatory approval.
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:14,flexWrap:"wrap"}}>
          <input value={sr} onChange={e=>setSr(e.target.value)} placeholder="Search deals..." style={{flex:1,minWidth:180,padding:"9px 12px",fontSize:13,border:"1.5px solid #E6E1D6",borderRadius:8,outline:"none",background:"#fff"}}/>
          <select value={so} onChange={e=>setSo(e.target.value)} style={{padding:"9px 12px",fontSize:13,border:"1.5px solid #E6E1D6",borderRadius:8,background:"#fff",cursor:"pointer"}}>
            {SORTS.map(o=><option key={o.id} value={o.id}>{o.l}</option>)}
          </select>
          {(ac||sr)&&<button onClick={()=>{setAc(null);setSr("")}} style={{fontSize:11,padding:"7px 12px",background:"#fee2e2",color:"#dc2626",border:"none",borderRadius:6,cursor:"pointer",fontWeight:600}}>Clear</button>}
          <span style={{fontSize:12,color:"#5A6169"}}>{fd.length}/{D.length}</span>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {fd.map(d=>(
            <Row key={d.id} d={d} open={ex===d.id} tog={()=>setEx(ex===d.id?null:d.id)} gP={gP} gS={gS}/>
          ))}
        </div>
        {fd.length===0&&<div style={{textAlign:"center",padding:"30px",color:"#5A6169"}}>No deals match.</div>}
        <div style={{marginTop:32,paddingTop:16,borderTop:"1px solid #E6E1D6",fontSize:11,color:"#5A6169"}}>
          Curated by Suruchi Sethi, PhD · Data from public announcements · Deal values are maximum potential including milestones
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
